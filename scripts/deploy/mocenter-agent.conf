# MoCenter Agent 配置（由 systemd 的 EnvironmentFile 注入启动参数）
# 服务端地址 host:port —— **必须填实际地址**。留空时 Agent 会拒绝启动并打印
# 该行提示；安装脚本会用 --server= 写入真实值。
# 刻意不再预置 your.server.com:9000 这类占位值：占位符看起来是"合法配置"，
# Agent 会安静地去解析一个不存在的域名并无限重连，运维看到的是"服务在跑但不在线"。
MOCENTER_SERVER=
# Agent 唯一标识（留空则回退为设备硬件 UUID / 主机名）
MOCENTER_AGENT_ID=
# 配置文件路径（JSON，含 agent_key / UUID / 证书路径等）
# 目录需对运行用户可写：单实例锁文件与配置文件同目录（.mocenter-Agent-*.lock）。
MOCENTER_CONFIG=/etc/mocenter/mocenter-agent.json
# 国内加速代理前缀（可选，用于公网 IP 探测与 VNC 安装包下载加速）
# MOCENTER_PROXY_IP=http://fa.mooncn.win/?url=
