# MoCenter Server 配置（由 systemd 的 EnvironmentFile 注入启动参数）
#
# ⚠️ 本文件**不存放口令明文**，也请不要在这里加 MOCENTER_PASSWORD=：
#    该写法会把口令带进 ExecStart，`ps -ef` / `systemctl show` 都能看到，
#    等于口令泄露。初始口令放在下面这个 0600 文件里（首次创建账号后即可删除）：
#
#      printf '%s' '你的强口令' | install -m 600 /dev/stdin /etc/mocenter/initial-password
#
#    服务启动时会读取它创建 admin 账号；已存在账号时该文件内容被忽略
#    （所以删除文件不会影响已有账号，也不会把改过的口令重置回去）。
MOCENTER_PASSWORD_FILE=/etc/mocenter/initial-password

# Agent TCP 长连接监听地址
MOCENTER_LISTEN=:9000
# Web 控制台 / REST API 监听地址
MOCENTER_HTTP=:8080
# 登录用户名
MOCENTER_USER=admin
# Web 前端目录（与安装包内一致；未随包附带前端时留空即可）
MOCENTER_WEB_DIR=/usr/share/mocenter/web
# 数据目录（审计日志、users.json、agent.key、托管安装包等）
MOCENTER_DATA=/var/lib/mocenter/data
# 显式指定配置文件路径，避免落到来回变化的当前工作目录
MOCENTER_CONFIG=/etc/mocenter/mocenter-server.json
# IP 白名单（逗号分隔，留空不限制；生产环境建议限制管理网段）
# MOCENTER_WHITELIST=10.0.0.0/8,192.168.0.0/16
# TLS / mTLS（证书就绪后取消注释启用；详见 scripts/build-linux-all.sh --help 中的 gen-certs）
# MOCENTER_TLS_CERT=/etc/mocenter/certs/server.crt
# MOCENTER_TLS_KEY=/etc/mocenter/certs/server.key
# MOCENTER_CA_CERT=/etc/mocenter/certs/ca.crt
