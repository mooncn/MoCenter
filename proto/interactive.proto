syntax = "proto3";

// 交互式命令协议
// 通过 PTY 伪终端实现实时输入输出，支持终端尺寸自适应与背压控制。
package mocenter;

option go_package = "mocenter/proto/interactive";

// Server -> Agent 交互输入
message InteractiveInputReq {
  string agent_id = 1;    // 目标 Agent
  string command_id = 2;  // 对应命令 ID
  bytes  input_data = 3;  // 用户键盘输入或管道数据
  int32  rows = 4;        // 终端行数（用于 WINSIZE 调整）
  int32  cols = 5;        // 终端列数
  string control = 6;     // 特殊控制码：ctrl_c 等
}

// Agent -> Server 交互输出（stdout/stderr/退出）
message InteractiveOutput {
  string command_id = 1;
  bytes  data = 2;
  string type = 3;        // stdout/stderr/exit
  int32  exit_code = 4;
}

// Agent -> Server 交互输入确认
message InteractiveInputResp {
  string command_id = 1;
  int32  status = 2;
}
