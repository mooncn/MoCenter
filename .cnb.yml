# MoCenter CI 流水线：构建 web / server / agent 三大部分
# 参考 CNB 流水线语法（docs.cnb.cool/zh/build）
#
# 本文件的三条硬约束（每条都对应一次真实代价，改之前先读）：
#
#  1. **不许用 `|| true` / `|| echo` 吞失败**。被吞掉的失败表现为"流水线绿了、产物却没有"，
#     只有到发布或用户报障时才暴露 —— 旧版里 `deb 打包`与 `precompress-web.sh` 两处就是这个形态。
#     允许"缺工具就先装再试"，不允许"缺工具就当没事发生"。
#  2. **前端只走 `npm ci`**。`|| npm install` 的回退会在锁文件与 registry 对不上时
#     装出未钉扎的依赖树：构建照样成功，但没人对产物的来源负责。
#  3. **push 必须跑 `go test ./...`**。旧版含 `go test` 的 `&x-build-go` 锚点从未被任何作业
#     引用过（写了个没人调的锚点 = 写了个假测试阶段），push 只 `go build`，
#     于是全部单测从来没在 CI 上跑过一次。现在检查逻辑收在 `&go-check` 里，
#     push 与 pull_request 两处共用同一份。
#
# 仍未做（记在 docs/security-review-2026-09-19.md §10 的 P3 行）：构建镜像按 digest 钉扎。

# Go 侧统一检查：vet + 全量单测 + 交叉编译锚定。
# 交叉编译只 build/vet 不 test：Windows 侧的 Agent 测试要真跑得有 Windows runner。
.go-check: &go-check
  |
    set -e
    echo "=== [server] go vet + go test ==="
    (cd server && go vet ./... && go test ./...)
    echo "=== [agent] go vet + go test ==="
    (cd agent && go vet ./... && go test ./...)
    echo "=== [installer] go vet + go test ==="
    (cd installer && go vet ./... && go test ./...)
    echo "=== 交叉编译锚定（agent 必须同时能在 linux/windows 上编译）==="
    (cd agent && GOOS=linux GOARCH=amd64 go build ./... \
      && GOOS=windows GOARCH=amd64 go build ./... \
      && GOOS=windows go vet ./...)
    (cd server && GOOS=linux GOARCH=amd64 go build ./...)
    echo "OK  go vet / go test / 交叉编译"

# 前端统一检查 + 构建。npm ci 严格照 package-lock.json，失败即红。
.web-ci: &web-ci
  |
    set -e
    cd web
    npm ci --no-audit --no-fund
    echo "=== 前端回归自检（这个位置以前只有一句 echo，等于没在把关）==="
    npm run check:vnc
    npm run check:flag
    # 页脚是全站唯一一处把服务端字符串交给 dangerouslySetInnerHTML 的地方，
    # 它的净化器没有浏览器也能跑，所以同样进 CI。
    npm run check:footer
    echo "=== 构建 + 预压缩 ==="
    npm run build
    # 预压缩失败不再被 `|| true` 吃掉：产物缺失时服务端会退化成每次请求现压，
    # 移动端首屏体积回到 3 倍 —— 那是功能退化，不是"可忽略的警告"。
    bash ../scripts/deploy/precompress-web.sh dist
    test -f dist/index.html || { echo "!! 构建成功退出却没产出 dist/index.html"; exit 1; }
    ls dist/assets/*.gz >/dev/null 2>&1 \
      || { echo "!! 预压缩没产出任何 .gz（检查 precompress-web.sh 与 dist 布局）"; exit 1; }
    echo "OK  web 自检 + 构建 + 预压缩"

main:
  push:
    - name: build-go
      docker:
        image: golang:1.26
      stages:
        # 检查放在构建之前：编译错误便宜、断言失败才是 CI 该抓的东西；
        # 顺序反了会让"build 先红"掩盖测试。
        - name: go-check
          script: *go-check
        - name: build-go
          script: |
            set -e
            echo "=== [server] go build ==="
            (cd server && go build -ldflags "-s -w" -o /tmp/mocenter-server .)
            echo "=== [agent] go build ==="
            (cd agent && CGO_ENABLED=0 go build \
              -ldflags "-s -w -X mocenter/agent/internal/version.Version=${MOCENTER_AGENT_VERSION:-1.0.1}" \
              -o /tmp/mocenter-agent .)
            # 成功退出却没产物 = 上一步被谁改错了输出路径；这里补最后一道确认
            test -s /tmp/mocenter-server && test -s /tmp/mocenter-agent
            echo "OK  /tmp/mocenter-server、/tmp/mocenter-agent"
    - name: package-linux
      docker:
        image: golang:1.26
      stages:
        - name: package-agent
          script: |
            set -e
            echo "=== [package] 构建 Linux amd64 二进制 ==="
            # 输出到 build/bin/agent/linux/mocenter-agent-amd64，而不是随手丢在 agent/ 下：
            # 打包脚本在 --binary=0 下只认这个布局（scripts/build-linux-all.sh 里
            # bin="$OUT/bin/$role/linux/mocenter-${role}-${arch}"）。旧版把二进制建到
            # agent/mocenter-agent，打包时"缺少二进制"只 warn 不 fail，再被 || echo 吞掉，
            # 于是 .deb 从来没真正产出过、流水线却一直绿。
            mkdir -p build/bin/agent/linux
            (cd agent && CGO_ENABLED=0 go build \
              -ldflags "-s -w -X mocenter/agent/internal/version.Version=${MOCENTER_AGENT_VERSION:-1.0.1}" \
              -o ../build/bin/agent/linux/mocenter-agent-amd64 .)
            echo "=== [package] 生成 .deb 安装包（含 systemd 服务） ==="
            # dpkg-deb 由 dpkg 包提供，Debian 基础镜像本就自带；真缺就先装上再跑。
            command -v dpkg-deb >/dev/null 2>&1 \
              || { echo "-- 缺 dpkg-deb，安装 dpkg"; apt-get update -qq && apt-get install -y -qq dpkg; }
            bash scripts/build-linux-all.sh --type=agent --package=deb --arch=amd64 --binary=0
            # 打包脚本对"缺输入"只 warn 并返回 0，所以产物必须由 CI 自己确认
            ls build/packages/deb/*.deb >/dev/null 2>&1 \
              || { echo "!! 打包脚本成功退出却没产出 .deb（看上方是否 warn「缺少二进制」）"; exit 1; }
            echo "OK  $(ls build/packages/deb/*.deb)"
    - name: build-web
      docker:
        image: node:20
      stages:
        - name: web-ci
          script: *web-ci

$:
  pull_request:
    - name: pr-build
      docker:
        image: golang:1.26
      stages:
        - name: go-check
          script: *go-check
        - name: script-guard
          # 构建/打包脚本的静态检查。
          # 这些脚本一旦写错目标平台（典型：windows/arm 并非 Go 支持的目标，
          # 报 "go: unsupported GOOS/GOARCH pair windows/arm"），只会在正式发布
          # 出包时才暴露，代价很大。这里在 PR 阶段就拦住。
          script: |
            # 说明：CI 各 step 的 script 由 /bin/sh（Debian 镜像上是 dash）解释执行。
            # 只做 `bash -n` 是不够的 —— 本库曾被 dash 加载时报
            #   scripts/lib/common.sh: Syntax error: "(" unexpected
            # 这种解析期错误只在「用 dash 解析」时才出现，bash -n 一律放过。
            # 故这里对公共库/纯 POSIX 脚本同时做 sh 语法检查，再在 sh 里真正 source 一次。
            echo "=== shell 语法检查 ==="
            for f in scripts/*.sh scripts/lib/*.sh scripts/deploy/*.sh; do
              bash -n "$f" && echo "OK(bash)  $f"
            done
            for f in scripts/lib/*.sh; do
              sh -n "$f" && echo "OK(sh)    $f" \
                || { echo "!! $f 在 /bin/sh(dash) 下无法解析（公共库必须保持 POSIX 兼容）"; exit 1; }
            done
            echo "=== 脚本公共库的架构矩阵自检（在 sh 中加载，模拟 CI 执行环境）==="
            sh -e -c '. scripts/lib/common.sh' \
              || { echo "!! 在 /bin/sh 下加载 scripts/lib/common.sh 失败"; exit 1; }
            . scripts/lib/common.sh
            for pair in $(for a in $MOCENTER_ARCHS_LINUX; do echo "linux/$a"; done) \
                        $(for a in $MOCENTER_ARCHS_WINDOWS; do echo "windows/$a"; done); do
              go tool dist list | grep -qx "$pair" \
                && echo "OK  $pair 受当前 Go 支持" \
                || { echo "!! $pair 不被当前 Go 支持，却在构建矩阵里（会构建失败）"; exit 1; }
            done
            echo "=== rpm 打包必须显式关闭 debuginfo 子包 ==="
            # 发行版 rpm 默认已定义 debug_package 宏（rpm>=4.14 中自带 %ifnarch noarch，
            # Fedora/CentOS/openSUSE 默认生效）。它会让 rpmbuild 生成 -debuginfo 子包，
            # 其文件清单来自 find-debuginfo 生成的 debugfiles.list；而该脚本只收录
            # 「ELF 且 not stripped」的文件。本项目二进制在构建期已被 strip（--ldflags
            # "-s -w"），清单恒为空，报：
            #   error: Empty %files file .../debugfiles.list
            # 现象是「整批 .rpm 全失败」，且报错与源码毫无关系，极易被误判为代码问题。
            # 这里在 PR 阶段就锚住这条约束，避免有人「顺手」把它删掉。
            grep -q 'debug_package %{nil}' scripts/build-linux-all.sh \
              && echo "OK  build-linux-all.sh 已显式关闭 debuginfo 子包" \
              || { echo "!! scripts/build-linux-all.sh 未关闭 debuginfo 子包，.rpm 会报 Empty %files"; exit 1; }
            grep -q 'Empty %files file .*debugfiles.list' scripts/build-linux-all.sh \
              && echo "OK  已内置 debuginfo 空清单报错的排查指引" \
              || { echo "!! 缺少 debuginfo 阶段的报错指引（缺 file(1) 时应给出提示）"; exit 1; }
            echo "=== 构建产物布局锚定 ==="
            # 产物路径散落在 shell/bat/iss/文档五处，任一处漏改就会出现"构建成功但产物
            # 落在旧目录"，而 CI 只跑构建不校验产物位置，这种漂移要到手工验证时才暴露。
            # 这里在 PR 阶段锚住统一布局（用途分类一次：bin / web / packages / setup）。
            #
            # 只看**赋值语句**有没有写旧路径：注释里的历史说明（"以前是 build/linux/
            # binaries/..."）不该被判红，那种误报会逼着人把解释删掉。
            grep -nE '(OUT|out_dir|dest|stage|src|zip|bin)=\$?\{?OUT\}?/(linux|windows)/(binaries|packages|installer|web)' \
              scripts/build-linux-all.sh \
              && { echo "!! scripts/build-linux-all.sh 仍把产物写到旧布局（<平台>/…）"; exit 1; } \
              || echo "OK  build-linux-all.sh 产物路径已是新布局"
            grep -nE 'SET \"?(SERVER_BIN|AGENT_BIN|WEB_OUT|ZIP_OUT|SETUP_OUT|ZR_STAGE)=.*(windows|linux)\\(binaries|packages|installer|web)' \
              scripts/build-all.bat \
              && { echo "!! scripts/build-all.bat 仍把产物写到旧布局（windows\\…）"; exit 1; } \
              || echo "OK  build-all.bat 产物路径已是新布局"
            grep -q 'packages/{deb,rpm,zip}' scripts/build-linux-all.sh \
              && echo "OK  build-linux-all.sh 帮助文本已说明新布局" \
              || { echo "!! scripts/build-linux-all.sh 的产物布局说明未同步"; exit 1; }
            grep -q 'OutputDir=..\\build\\setup' installer/setup.iss \
              && echo "OK  setup.iss 输出到 build\\setup" \
              || { echo "!! installer/setup.iss 的 OutputDir 未同步到 build\\setup"; exit 1; }
            grep -q 'OUT_DIR=%OUT_ROOT%\\setup' scripts/build-windows-installer.bat \
              && echo "OK  build-windows-installer.bat 与 setup.iss 输出目录一致" \
              || { echo "!! build-windows-installer.bat 的输出目录与 setup.iss 不一致"; exit 1; }
            echo "=== 证书工具编译与测试 ==="
            (cd scripts/gencerts && go build ./... && go vet ./... && echo "OK  scripts/gencerts")
            (cd scripts/signcert && go build ./... && go vet ./... && go test ./... && echo "OK  scripts/signcert")
        - name: web-build
          image: node:20
          script: *web-ci
    - name: security-scan
      docker:
        image: golang:1.26
      # 依赖漏洞扫描常态化（上一轮的 8 条 x/crypto + 18 条 stdlib 就是靠人工才发现的）。
      # govulncheck 做的是**可达性判定**（只有真正被调用到的符号才报），
      # 所以不会像版本匹配类扫描那样淹没人；因此这里可以直接判红，不必降级成警告。
      stages:
        - name: go-vuln
          script: |
            set -e
            if ! command -v govulncheck >/dev/null 2>&1; then
              go install golang.org/x/vuln/cmd/govulncheck@latest
            fi
            GVC="$(command -v govulncheck || echo "$(go env GOPATH)/bin/govulncheck")"
            for m in server agent installer; do
              echo "=== govulncheck $m ==="
              (cd $m && "$GVC" ./...)
            done
            echo "OK  三个 Go 模块均无可达漏洞"
        - name: npm-audit
          image: node:20
          script: |
            set -e
            cd web
            npm ci --no-audit --no-fund
            # 必须显式指向官方源：registry.npmmirror.com 不实现 /-/npm/v1/security/*，
            # 用镜像跑 audit 会 404 —— 那正是"日常根本没有审计通道"的原因。
            echo "=== npm audit（生产依赖，high 及以上判红）==="
            npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
