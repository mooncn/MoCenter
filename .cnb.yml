# MoCenter CI 流水线：构建 web / server / agent 三大部分
# 参考 CNB 流水线语法（docs.cnb.cool/zh/build）

# 公共构建步骤（YAML 锚点复用）
.x-build-go: &x-build-go
  image: golang:1.25
  script: |
    echo "=== [server] 构建 mocenter-server ==="
    cd server && go mod download && go build -ldflags "-s -w" -o mocenter-server . && cd ..
    echo "=== [agent] 构建 mocenter-agent (linux) ==="
    cd agent && CGO_ENABLED=0 go build -ldflags "-s -w -X mocenter/agent/internal/version.Version=${MOCENTER_AGENT_VERSION:-1.0.1}" -o mocenter-agent . && cd ..
    echo "=== Go 单元测试 ==="
    cd server && go test ./...
    cd ../agent && go test ./...

main:
  push:
    - name: build-go
      docker:
        image: golang:1.25
      stages:
        - name: build-go
          script: |
            echo "=== [server] go build ==="
            cd server && go build -ldflags "-s -w" -o /tmp/mocenter-server . && echo OK
            echo "=== [agent] go build ==="
            cd ../agent && CGO_ENABLED=0 go build -ldflags "-s -w -X mocenter/agent/internal/version.Version=${MOCENTER_AGENT_VERSION:-1.0.1}" -o /tmp/mocenter-agent . && echo OK
            echo "=== go test ==="
            cd /tmp
        - name: build-web
          image: node:20
          script: |
            echo "=== [web] npm install & build ==="
            cd web && npm install --no-audit --no-fund && npm run build
            # 预压缩：服务端优先回传 .gz/.br，弱网/移动端首屏体积降到约 1/3
            bash scripts/deploy/precompress-web.sh web/dist || true
            echo "web build done -> dist/"
    - name: package-linux
      docker:
        image: golang:1.25
      stages:
        - name: package-agent
          script: |
            echo "=== [package] 构建 Linux amd64 二进制 ==="
            cd agent && CGO_ENABLED=0 go build -ldflags "-s -w -X mocenter/agent/internal/version.Version=${MOCENTER_AGENT_VERSION:-1.0.1}" -o mocenter-agent .
            echo "=== [package] 生成 .deb 安装包（含 systemd 服务） ==="
            bash scripts/build-linux-all.sh --type=agent --package=deb --arch=amd64 --binary=0 \
              || echo "deb 打包需在构建机安装 dpkg-deb"
    - name: build-web
      docker:
        image: node:20
      stages:
        - name: install
          script: cd web && npm ci --no-audit --no-fund || npm install --no-audit --no-fund
        - name: build
          script: |
            cd web && npm run build
            bash ../scripts/deploy/precompress-web.sh dist || true
        - name: lint
          script: cd web && echo "web build & assets generated"

$:
  pull_request:
    - name: pr-build
      docker:
        image: golang:1.25
      stages:
        - name: go-build
          script: |
            cd server && go build ./... && echo "server build OK"
            cd ../agent && go build ./... && echo "agent build OK"
        - name: script-guard
          # 构建/打包脚本的静态检查。
          # 这些脚本一旦写错目标平台（典型：windows/arm 并非 Go 支持的目标，
          # 报 "go: unsupported GOOS/GOARCH pair windows/arm"），只会在正式发布
          # 出包时才暴露，代价很大。这里在 PR 阶段就拦住。
          script: |
            # 说明：CI 各 step 的 script 由 /bin/sh（Debian 镜像上是 dash）解释执行。
            # 只做 `bash -n` 是不够的 —— 本库曾被 dash 加载时报
            #   scripts/lib/common.sh: Syntax error: "(" unexpected
            # 这种解析期错误只在「用 dash 解析」时才出现，bash -n 一律放过。
            # 故这里对公共库/纯 POSIX 脚本同时做 sh 语法检查，再在 sh 里真正 source 一次。
            echo "=== shell 语法检查 ==="
            for f in scripts/*.sh scripts/lib/*.sh scripts/deploy/*.sh; do
              bash -n "$f" && echo "OK(bash)  $f"
            done
            for f in scripts/lib/*.sh; do
              sh -n "$f" && echo "OK(sh)    $f" \
                || { echo "!! $f 在 /bin/sh(dash) 下无法解析（公共库必须保持 POSIX 兼容）"; exit 1; }
            done
            echo "=== 脚本公共库的架构矩阵自检（在 sh 中加载，模拟 CI 执行环境）==="
            sh -e -c '. scripts/lib/common.sh' \
              || { echo "!! 在 /bin/sh 下加载 scripts/lib/common.sh 失败"; exit 1; }
            . scripts/lib/common.sh
            for pair in $(for a in $MOCENTER_ARCHS_LINUX; do echo "linux/$a"; done) \
                        $(for a in $MOCENTER_ARCHS_WINDOWS; do echo "windows/$a"; done); do
              go tool dist list | grep -qx "$pair" \
                && echo "OK  $pair 受当前 Go 支持" \
                || { echo "!! $pair 不被当前 Go 支持，却在构建矩阵里（会构建失败）"; exit 1; }
            done
            echo "=== rpm 打包必须显式关闭 debuginfo 子包 ==="
            # 发行版 rpm 默认已定义 debug_package 宏（rpm>=4.14 中自带 %ifnarch noarch，
            # Fedora/CentOS/openSUSE 默认生效）。它会让 rpmbuild 生成 -debuginfo 子包，
            # 其文件清单来自 find-debuginfo 生成的 debugfiles.list；而该脚本只收录
            # 「ELF 且 not stripped」的文件。本项目二进制在构建期已被 strip（--ldflags
            # "-s -w"），清单恒为空，报：
            #   error: Empty %files file .../debugfiles.list
            # 现象是「整批 .rpm 全失败」，且报错与源码毫无关系，极易被误判为代码问题。
            # 这里在 PR 阶段就锚住这条约束，避免有人「顺手」把它删掉。
            grep -q 'debug_package %{nil}' scripts/build-linux-all.sh \
              && echo "OK  build-linux-all.sh 已显式关闭 debuginfo 子包" \
              || { echo "!! scripts/build-linux-all.sh 未关闭 debuginfo 子包，.rpm 会报 Empty %files"; exit 1; }
            grep -q 'Empty %files file .*debugfiles.list' scripts/build-linux-all.sh \
              && echo "OK  已内置 debuginfo 空清单报错的排查指引" \
              || { echo "!! 缺少 debuginfo 阶段的报错指引（缺 file(1) 时应给出提示）"; exit 1; }
            echo "=== 构建产物布局锚定 ==="
            # 产物路径散落在 shell/bat/iss/文档五处，任一处漏改就会出现"构建成功但产物
            # 落在旧目录"，而 CI 只跑构建不校验产物位置，这种漂移要到手工验证时才暴露。
            # 这里在 PR 阶段锚住统一布局（用途分类一次：bin / web / packages / setup）。
            #
            # 只看**赋值语句**有没有写旧路径：注释里的历史说明（"以前是 build/linux/
            # binaries/..."）不该被判红，那种误报会逼着人把解释删掉。
            grep -nE '(OUT|out_dir|dest|stage|src|zip|bin)=\$?\{?OUT\}?/(linux|windows)/(binaries|packages|installer|web)' \
              scripts/build-linux-all.sh \
              && { echo "!! scripts/build-linux-all.sh 仍把产物写到旧布局（<平台>/…）"; exit 1; } \
              || echo "OK  build-linux-all.sh 产物路径已是新布局"
            grep -nE 'SET \"?(SERVER_BIN|AGENT_BIN|WEB_OUT|ZIP_OUT|SETUP_OUT|ZR_STAGE)=.*(windows|linux)\\(binaries|packages|installer|web)' \
              scripts/build-all.bat \
              && { echo "!! scripts/build-all.bat 仍把产物写到旧布局（windows\\…）"; exit 1; } \
              || echo "OK  build-all.bat 产物路径已是新布局"
            grep -q 'packages/{deb,rpm,zip}' scripts/build-linux-all.sh \
              && echo "OK  build-linux-all.sh 帮助文本已说明新布局" \
              || { echo "!! scripts/build-linux-all.sh 的产物布局说明未同步"; exit 1; }
            grep -q 'OutputDir=..\\build\\setup' installer/setup.iss \
              && echo "OK  setup.iss 输出到 build\\setup" \
              || { echo "!! installer/setup.iss 的 OutputDir 未同步到 build\\setup"; exit 1; }
            grep -q 'OUT_DIR=%OUT_ROOT%\\setup' scripts/build-windows-installer.bat \
              && echo "OK  build-windows-installer.bat 与 setup.iss 输出目录一致" \
              || { echo "!! build-windows-installer.bat 的输出目录与 setup.iss 不一致"; exit 1; }
            echo "=== 证书工具编译与测试 ==="
            (cd scripts/gencerts && go build ./... && go vet ./... && echo "OK  scripts/gencerts")
            (cd scripts/signcert && go build ./... && go vet ./... && go test ./... && echo "OK  scripts/signcert")
        - name: web-build
          image: node:20
          script: |
            cd web && npm install --no-audit --no-fund && npm run build
            bash ../scripts/deploy/precompress-web.sh dist || true
            echo "web build OK"
